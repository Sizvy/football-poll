<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matchday — Team Sheet</title>
<style>
  :root{
    --pitch-dark:#0f2a1c;
    --pitch:#1f5d3a;
    --pitch-line:rgba(245,241,230,0.35);
    --chalk:#f5f1e6;
    --chalk-2:#ece5d3;
    --ink:#16201a;
    --ink-soft:#4b5a4f;
    --amber:#e3a72b;
    --red:#c1432d;
    --team-a:#2b4c7e;
    --team-b:#c9861f;
    --radius:14px;
    --display: 'Arial Narrow', 'Helvetica Neue Condensed', 'Oswald', Impact, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--body);
    background:var(--pitch-dark);
    color:var(--ink);
    min-height:100vh;
  }
  .field-bg{
    position:fixed; inset:0; z-index:-1;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 40px, rgba(0,0,0,0.03) 40px 80px),
      radial-gradient(ellipse at 50% -10%, #2a6b43 0%, var(--pitch-dark) 70%);
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
    color:var(--chalk);
  }
  header .eyebrow{
    font-family:var(--display);
    letter-spacing:0.25em;
    font-size:12px;
    color:var(--amber);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  header h1{
    font-family:var(--display);
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-size:clamp(28px,6vw,42px);
    margin:0 0 4px;
  }
  header p{
    margin:0; color:rgba(245,241,230,0.7); font-size:14px;
  }
  .vote-tally{
    display:inline-block;
    font-family:var(--display); text-transform:uppercase; letter-spacing:0.08em;
    font-size:12px; font-weight:700;
    background:rgba(227,167,43,0.15);
    color:var(--amber);
    border:1px solid rgba(227,167,43,0.4);
    padding:5px 14px; border-radius:999px;
    margin-top:10px;
  }
  .tabs{
    display:flex; justify-content:center; gap:6px;
    padding:0 16px 20px; flex-wrap:wrap;
  }
  .tab{
    font-family:var(--display); text-transform:uppercase; letter-spacing:0.08em;
    font-size:13px; font-weight:700;
    background:rgba(245,241,230,0.08);
    color:var(--chalk);
    border:1px solid rgba(245,241,230,0.25);
    padding:9px 18px; border-radius:999px; cursor:pointer;
    transition:all .15s ease;
  }
  .tab:hover{ background:rgba(245,241,230,0.16); }
  .tab.active{ background:var(--amber); color:var(--pitch-dark); border-color:var(--amber); }

  main{ max-width:640px; margin:0 auto; padding:0 16px 60px; }
  .card{
    background:var(--chalk);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
    margin-bottom:18px;
  }
  .card h2{
    font-family:var(--display); text-transform:uppercase; letter-spacing:0.04em;
    font-size:20px; margin:0 0 4px; color:var(--ink);
  }
  .card .sub{ font-size:13px; color:var(--ink-soft); margin:0 0 18px; }

  label{ display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:14px 0 6px; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=number], textarea, select{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid #d8d0bb;
    background:#fff; font-family:var(--body); font-size:15px; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:60px; }
  .pos-picker{ display:flex; gap:8px; }
  .pos-btn{
    flex:1; padding:12px 6px; text-align:center; border-radius:8px; border:2px solid #d8d0bb;
    background:#fff; cursor:pointer; font-family:var(--display); text-transform:uppercase; letter-spacing:0.04em; font-weight:700; font-size:14px;
    transition:all .15s ease;
  }
  .pos-btn.active{ border-color:var(--pitch); background:var(--pitch); color:#fff; }

  .checkbox-row{ display:flex; align-items:center; gap:10px; margin-top:14px; }
  .checkbox-row input{ width:18px; height:18px; accent-color:var(--red); }
  .checkbox-row span{ font-size:14px; color:var(--ink); }

  .btn{
    font-family:var(--display); text-transform:uppercase; letter-spacing:0.05em; font-weight:700;
    border:none; border-radius:8px; padding:13px 20px; font-size:14px; cursor:pointer;
    width:100%; margin-top:20px; transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--pitch); color:#fff; }
  .btn-danger{ background:var(--red); color:#fff; }
  .btn-outline{ background:transparent; border:1.5px solid var(--ink-soft); color:var(--ink); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .msg{ font-size:13px; padding:10px 12px; border-radius:8px; margin-top:12px; }
  .msg-ok{ background:#e2f0e5; color:#1f5d3a; }
  .msg-err{ background:#fbe4de; color:var(--red); }

  .ticket{
    background:linear-gradient(135deg,var(--pitch) 0%,var(--pitch-dark) 100%);
    color:var(--chalk); border-radius:var(--radius); padding:26px; text-align:center;
    position:relative; overflow:hidden;
  }
  .ticket .lock{ font-size:34px; margin-bottom:6px; }
  .ticket .team-stamp{
    font-family:var(--display); font-weight:800; font-size:38px; letter-spacing:0.05em;
    text-transform:uppercase; margin:6px 0;
  }
  .ticket .team-stamp.a{ color:#8fb3ff; }
  .ticket .team-stamp.b{ color:var(--amber); }
  .ticket .note{ font-size:13px; color:rgba(245,241,230,0.75); }
  .countdown{ font-family:var(--display); font-size:15px; letter-spacing:0.05em; margin-top:10px; color:var(--amber); }

  .pitch-wrap{ display:flex; flex-direction:column; gap:16px; }
  .mini-pitch{
    background:var(--pitch); border-radius:12px; padding:14px; position:relative;
    border:2px solid var(--pitch-line);
  }
  .mini-pitch::before{
    content:''; position:absolute; left:50%; top:8px; bottom:8px; width:1px; background:var(--pitch-line); transform:translateX(-50%);
  }
  .mini-pitch h3{
    font-family:var(--display); text-transform:uppercase; color:var(--chalk); margin:0 0 10px; font-size:15px; letter-spacing:0.06em;
  }
  .mini-pitch h3 .avg{ color:var(--amber); font-size:11px; margin-left:8px; letter-spacing:0.02em; text-transform:none; font-family:var(--body); font-weight:600; }
  .line{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:10px; }
  .line-label{ text-align:center; font-size:10px; letter-spacing:0.1em; color:rgba(245,241,230,0.55); text-transform:uppercase; margin-bottom:4px; }
  .chip{
    background:rgba(245,241,230,0.95); color:var(--ink); border-radius:999px; padding:6px 12px;
    font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;
  }
  .chip .inj{ color:var(--red); }
  .chip .shifted{ font-size:10px; color:var(--ink-soft); font-style:italic; }
  .voted-wrap{ display:flex; flex-wrap:wrap; gap:6px; }
  .voted-chip{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--pitch); color:#fff; border-radius:999px; padding:6px 12px;
    font-size:13px; font-weight:600;
  }
  .voted-chip .inj{ color:#ffb4a3; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:8px 6px; border-bottom:1px solid var(--chalk-2); text-align:left; vertical-align:middle; }
  th{ font-family:var(--display); text-transform:uppercase; letter-spacing:0.04em; font-size:11px; color:var(--ink-soft); }
  td input, td select{ padding:6px 8px; font-size:13px; }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{ border:none; background:var(--chalk-2); border-radius:6px; padding:6px 9px; cursor:pointer; font-size:13px; }
  .icon-btn.danger{ background:#fbe4de; color:var(--red); }
  .team-tag{ font-family:var(--display); font-weight:800; font-size:12px; padding:2px 8px; border-radius:6px; color:#fff; }
  .team-tag.a{ background:var(--team-a); }
  .team-tag.b{ background:var(--team-b); }

  .locked-gate{ text-align:center; padding:20px 0; }
  .locked-gate input{ text-align:center; letter-spacing:0.2em; font-family:var(--display); font-size:18px; }

  .subtabs{ display:flex; gap:6px; margin-bottom:16px; }
  .subtab{
    font-family:var(--display); text-transform:uppercase; letter-spacing:0.05em; font-weight:700; font-size:12px;
    background:var(--chalk-2); border:1px solid #d8d0bb; color:var(--ink-soft);
    padding:8px 16px; border-radius:999px; cursor:pointer;
  }
  .subtab.active{ background:var(--pitch); color:#fff; border-color:var(--pitch); }

  .pool-picker{ position:relative; }
  .pool-picker-list{
    margin-top:6px; max-height:220px; overflow-y:auto; border:1px solid #d8d0bb; border-radius:8px; background:#fff;
  }
  .pool-option{
    padding:10px 12px; cursor:pointer; font-size:14px; border-bottom:1px solid var(--chalk-2);
  }
  .pool-option:last-child{ border-bottom:none; }
  .pool-option:hover{ background:var(--chalk-2); }
  .pool-picker-selected{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--chalk-2); border-radius:8px; padding:10px 12px; margin-top:6px;
    font-weight:600;
  }
  .pool-picker-selected button{
    font-family:var(--display); text-transform:uppercase; font-size:11px; font-weight:700;
    background:transparent; border:1px solid var(--ink-soft); border-radius:6px; padding:5px 12px; cursor:pointer;
  }

  footer{ text-align:center; color:rgba(245,241,230,0.4); font-size:12px; padding:20px; }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
</style>
</head>
<body>
<div class="field-bg"></div>
<header>
  <div class="eyebrow">Pickup football · squad builder</div>
  <h1>Matchday Sheet</h1>
  <p id="headerSub">Pick your name, flag any injuries. Ratings are set by the coordinator, not you.</p>
  <div class="vote-tally" id="voteTally">– voted</div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="vote">Vote</button>
  <button class="tab" data-tab="status">My Status</button>
  <button class="tab" data-tab="admin">Admin</button>
</div>

<main>
  <div id="tab-vote"></div>
  <div id="tab-status" style="display:none"></div>
  <div id="tab-admin" style="display:none"></div>
</main>

<footer>Rosters recomputed live · hidden until the coordinator reveals them</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, get, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

/* ============ CONFIG ============ */
// Passcode is stored as a SHA-256 hash, not plaintext, so it isn't trivially
// readable via "view source". Current passcode is "changeme123" — ask Claude
// to generate a new hash for you if you want to change it.
const ADMIN_PASSCODE_HASH = "494a715f7e9b4071aca61bac42ca858a309524e5864f0920030862a4ae7589be";

const firebaseConfig = {
  apiKey: "AIzaSyAoEHD9YqlB_zVgpYLz1OsncCDIYm50Wz4",
  authDomain: "football-poll-ed010.firebaseapp.com",
  databaseURL: "https://football-poll-ed010-default-rtdb.firebaseio.com",
  projectId: "football-poll-ed010",
  storageBucket: "football-poll-ed010.firebasestorage.app",
  messagingSenderId: "739088818706",
  appId: "1:739088818706:web:190be214acb90d7b7f6ecb"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const sessionRef = ref(db, "sessions/current");
const poolRootRef = ref(db, "pool/players");

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

/* ============ STATE ============ */
let session = null;
let pool = []; // array of {id, name, rating, stamina, position}
let deviceToken = getDeviceToken();
let adminUnlocked = false;
let activeTab = "vote";
let adminSubTab = "session"; // "session" | "pool"
let poolAddPosition = "D";

function getDeviceToken(){
  let t = localStorage.getItem("ff_device_token");
  if(!t){ t = "dev_" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("ff_device_token", t); }
  return t;
}
function playerRef(token){ return ref(db, "sessions/current/players/" + token); }
function poolPlayerRef(id){ return ref(db, "pool/players/" + id); }
const metaRef = ref(db, "sessions/current/meta");

function emptySession(){
  return { createdAt: new Date().toISOString(), cutoffISO: null, revealNow: false, players: [] };
}

// Each vote is stored as {poolId, injured, injuryNote, sitOut, teamOverride, votedAt}
// keyed by device token — name/rating/stamina/position are NOT stored per vote,
// they're looked up from the pool at render time (see recompute()).
function normalizeSession(raw){
  const meta = (raw && raw.meta) || {};
  const playersObj = (raw && raw.players) || {};
  const players = Object.keys(playersObj).map(key => ({ id: key, deviceToken: key, _dbKey: key, ...playersObj[key] }));
  return {
    createdAt: meta.createdAt || new Date().toISOString(),
    cutoffISO: meta.cutoffISO || null,
    revealNow: !!meta.revealNow,
    players
  };
}
function normalizePool(raw){
  const obj = raw || {};
  return Object.keys(obj).map(key => ({ id: key, name: "", rating: 50, stamina: 50, position: "M", ...obj[key] }));
}

/* ============ STORAGE I/O (Firebase Realtime Database) ============ */
async function loadSession(){
  try{
    const snap = await get(sessionRef);
    return normalizeSession(snap.exists() ? snap.val() : null);
  }catch(e){
    console.error("Load failed", e);
    return emptySession();
  }
}
// Only used for a full session reset (admin "start new session"). Every other
// write goes through playerRef()/metaRef() scoped writes, on purpose, so two
// people acting at once can never clobber each other.
async function resetSession(){
  try{
    await set(sessionRef, { meta: { createdAt: new Date().toISOString(), cutoffISO: null, revealNow: false } });
  }catch(e){
    console.error("Reset failed", e);
    showMsg("admMsg2", "Could not reset — check your connection and try again.", true);
  }
}

/* ============ BALANCING ALGORITHM ============ */
const POS_ORDER = ["D","M","A"];

function cloneState(s){ return JSON.parse(JSON.stringify(s)); }

// Joins each vote with its pool record (name/rating/stamina/position), then
// runs team assignment + on-field position balancing. session.players ends
// up holding the merged, computed objects the rest of the app renders.
function recompute(s){
  const joined = s.players.map(v=>{
    const p = pool.find(pp => pp.id === v.poolId);
    return {
      ...v,
      name: p ? p.name : "(unknown player)",
      rating: p && typeof p.rating === "number" ? p.rating : 50,
      stamina: p && typeof p.stamina === "number" ? p.stamina : 50,
      position: p && p.position ? p.position : "M"
    };
  });
  computeTeams(joined);
  const teamA = joined.filter(p=>p.team==="A");
  const teamB = joined.filter(p=>p.team==="B");
  computeFieldPositions(teamA);
  computeFieldPositions(teamB);
  s.players = joined;
  return s;
}

// Priority order (each tier only matters once the tier above it is tied):
// 1. headcount   2. position lines   3. stamina   4. rating
const W_COUNT = 1e9, W_POS = 1e5, W_STAMINA = 1e2, W_RATING = 1;

function computeTeams(players){
  const eligible = players.filter(p => !p.sitOut);
  const overridden = eligible.filter(p => p.teamOverride);
  const rest = eligible.filter(p => !p.teamOverride)
    .slice()
    .sort((a,b) => (b.rating - a.rating) || (b.stamina - a.stamina) || a.id.localeCompare(b.id));

  const state = {
    A:{count:0, stamina:0, rating:0, pos:{D:0,M:0,A:0}},
    B:{count:0, stamina:0, rating:0, pos:{D:0,M:0,A:0}}
  };
  const assign = {};

  overridden.forEach(p=>{
    assign[p.id] = p.teamOverride;
    const s = state[p.teamOverride];
    s.count++; s.stamina += p.stamina; s.rating += p.rating; s.pos[p.position]++;
  });

  function imbalance(sA, sB){
    return Math.abs(sA.count - sB.count) * W_COUNT
      + Math.abs(sA.stamina - sB.stamina) * W_STAMINA
      + (Math.abs(sA.pos.D-sB.pos.D)+Math.abs(sA.pos.M-sB.pos.M)+Math.abs(sA.pos.A-sB.pos.A)) * W_POS
      + Math.abs(sA.rating - sB.rating) * W_RATING;
  }

  rest.forEach(p=>{
    const A2 = cloneState(state.A); A2.count++; A2.stamina+=p.stamina; A2.rating+=p.rating; A2.pos[p.position]++;
    const B2 = cloneState(state.B); B2.count++; B2.stamina+=p.stamina; B2.rating+=p.rating; B2.pos[p.position]++;
    const scoreA = imbalance(A2, state.B);
    const scoreB = imbalance(state.A, B2);
    const team = scoreA <= scoreB ? "A" : "B";
    assign[p.id] = team;
    const s = state[team];
    s.count++; s.stamina += p.stamina; s.rating += p.rating; s.pos[p.position]++;
  });

  function applyMove(p, from, to){
    state[from].count--; state[from].stamina -= p.stamina; state[from].rating -= p.rating; state[from].pos[p.position]--;
    state[to].count++; state[to].stamina += p.stamina; state[to].rating += p.rating; state[to].pos[p.position]++;
    assign[p.id] = to;
  }
  function swapPlayers(p1, p2){
    const t1 = assign[p1.id], t2 = assign[p2.id];
    applyMove(p1, t1, t2);
    applyMove(p2, t2, t1);
  }
  function totalImbalance(){ return imbalance(state.A, state.B); }

  let improved = true, iter = 0;
  const movable = eligible.filter(p=>!p.teamOverride);
  while(improved && iter < 200){
    improved = false; iter++;
    for(const p1 of movable){
      for(const p2 of movable){
        if(p1.id===p2.id) continue;
        if(assign[p1.id] === assign[p2.id]) continue;
        const before = totalImbalance();
        swapPlayers(p1,p2);
        const after = totalImbalance();
        if(after < before){ improved = true; }
        else{ swapPlayers(p1,p2); }
      }
    }
  }

  eligible.forEach(p => p.team = assign[p.id]);
  players.filter(p=>p.sitOut).forEach(p => p.team = null);
  return players;
}

function computeFieldPositions(teamPlayers){
  const n = teamPlayers.length;
  if(n===0) return teamPlayers;
  const base = Math.floor(n/3), rem = n%3;
  const idealArr = [base,base,base];
  for(let i=0;i<rem;i++) idealArr[i]++;
  const ideal = { D:idealArr[0], M:idealArr[1], A:idealArr[2] };

  const bucket = { D:[], M:[], A:[] };
  teamPlayers.forEach(p=>{ p.fieldPosition = p.position; bucket[p.position].push(p); });

  let guard = 0;
  while(guard++ < 60){
    let moved = false;
    for(let i=0;i<3;i++){
      const line = POS_ORDER[i];
      if(bucket[line].length > ideal[line]){
        const neighbors = [];
        if(i>0) neighbors.push(POS_ORDER[i-1]);
        if(i<2) neighbors.push(POS_ORDER[i+1]);
        for(const nb of neighbors){
          if(bucket[nb].length < ideal[nb]){
            bucket[line].sort((a,b)=>a.rating-b.rating);
            const mover = bucket[line].pop();
            mover.fieldPosition = nb;
            bucket[nb].push(mover);
            moved = true; break;
          }
        }
      }
      if(moved) break;
    }
    if(!moved) break;
  }
  return teamPlayers;
}

/* ============ REVEAL LOGIC ============ */
function isRevealed(s){
  if(s.revealNow) return true;
  if(!s.cutoffISO) return false;
  return new Date() >= new Date(s.cutoffISO);
}
function posLabel(p){ return {D:"Defense", M:"Mid", A:"Attack"}[p] || p; }

/* ============ POOL PICKER (reused by Vote tab + Admin proxy-add) ============ */
function setupPoolPicker(prefix, initialPoolId, onSelect){
  let selected = initialPoolId || null;
  const searchEl = document.getElementById(prefix+"Search");
  const listEl = document.getElementById(prefix+"List");
  const selectedEl = document.getElementById(prefix+"Selected");

  function showSelectedView(){
    const p = pool.find(pp=>pp.id===selected);
    searchEl.style.display = "none";
    listEl.style.display = "none";
    selectedEl.style.display = "flex";
    selectedEl.innerHTML = `<span>${p ? escapeHtml(p.name) : "Unknown"}</span><button type="button" data-clear>Change</button>`;
    selectedEl.querySelector("[data-clear]").addEventListener("click", ()=>{
      selected = null;
      showSearchView();
      if(onSelect) onSelect(null);
    });
    if(onSelect) onSelect(selected);
  }
  function showSearchView(){
    selectedEl.style.display = "none";
    searchEl.style.display = "block";
    listEl.style.display = "block";
    searchEl.value = "";
    renderList("");
    searchEl.focus();
  }
  function renderList(query){
    const q = query.trim().toLowerCase();
    const matches = pool.filter(p=>p.name.toLowerCase().includes(q)).slice(0,8);
    listEl.innerHTML = matches.map(p=>{
      const already = session.players.some(sp => sp.poolId === p.id && sp.deviceToken !== deviceToken);
      return `<div class="pool-option" data-id="${p.id}">${escapeHtml(p.name)}${already ? ' <span class="hint" style="display:inline;">· already in session</span>' : ''}</div>`;
    }).join("") || '<div class="hint" style="padding:8px;">No matches — add them in the Player Pool tab.</div>';
    listEl.querySelectorAll("[data-id]").forEach(opt=>{
      opt.addEventListener("click", ()=>{
        selected = opt.dataset.id;
        showSelectedView();
      });
    });
  }
  searchEl.addEventListener("input", (e)=> renderList(e.target.value));
  if(selected){ showSelectedView(); } else { showSearchView(); if(onSelect) onSelect(null); }
  return { getSelected: () => selected };
}

// Shows/hides a warning + "withdraw that entry" action when the picked pool
// player already has an entry in today's session under a different key.
function renderConflictBanner(boxId, submitBtnId, conflictKey, name){
  const box = document.getElementById(boxId);
  const submitBtn = document.getElementById(submitBtnId);
  if(!box) return;
  if(!conflictKey){
    box.innerHTML = "";
    if(submitBtn) submitBtn.disabled = false;
    return;
  }
  box.innerHTML = `<div class="msg msg-err">${escapeHtml(name)} is already in today's session. <button class="icon-btn danger" id="${boxId}Withdraw" style="margin-top:6px;">Withdraw that entry</button></div>`;
  document.getElementById(boxId+"Withdraw").addEventListener("click", async ()=>{
    try{ await remove(playerRef(conflictKey)); }catch(e){ console.error(e); }
    box.innerHTML = "";
    if(submitBtn) submitBtn.disabled = false;
  });
  if(submitBtn) submitBtn.disabled = true;
}

async function onSubmitVote(){
  const poolId = votePicker ? votePicker.getSelected() : null;
  if(!poolId){ showMsg("voteMsg", "Please select your name first.", true); return; }
  const injured = document.getElementById("f-injured").checked;
  const injuryNote = document.getElementById("f-injuryNote").value.trim();

  try{
    const snap = await get(ref(db, "sessions/current/players"));
    const raw = snap.exists() ? snap.val() : {};
    const conflictKey = Object.keys(raw).find(k => k !== deviceToken && raw[k].poolId === poolId);
    if(conflictKey){
      const name = (pool.find(p=>p.id===poolId) || {}).name || "This player";
      showMsg("voteMsg", `${name} is already in today's session.`, true);
      renderConflictBanner("voteConflict","submitVote", conflictKey, name);
      return;
    }

    const ownRaw = raw[deviceToken];
    const votedAt = (ownRaw && ownRaw.votedAt) ? ownRaw.votedAt : new Date().toISOString();

    await set(playerRef(deviceToken), {
      poolId, injured, injuryNote, sitOut: false, votedAt
    });
    showMsg("voteMsg", "Saved. Head to 'My Status' to see your placement.", false);
  }catch(e){
    console.error("Vote save failed", e);
    showMsg("voteMsg", "Could not save — check your connection and try again.", true);
  }
  renderVote();
}

async function onWithdrawVote(){
  try{
    await remove(playerRef(deviceToken));
  }catch(e){
    console.error("Withdraw failed", e);
  }
  renderVote();
}

function avgOf(list, field){ return list.length ? Math.round(list.reduce((s,p)=>s+p[field],0)/list.length) : 0; }

function renderPitches(){
  const teamA = session.players.filter(p=>p.team==="A" && !p.sitOut);
  const teamB = session.players.filter(p=>p.team==="B" && !p.sitOut);
  function pitchHtml(team, label){
    const lines = {D:[], M:[], A:[]};
    team.forEach(p => lines[p.fieldPosition||p.position].push(p));
    function chip(p){
      const shiftedNote = p.fieldPosition!==p.position ? `<span class="shifted">(from ${posLabel(p.position)})</span>` : "";
      return `<div class="chip"><span>${escapeHtml(p.name)}</span>${p.injured?'<span class="inj">✚</span>':''}${shiftedNote}</div>`;
    }
    return `
      <div class="mini-pitch">
        <h3>${label} <span class="avg">${team.length} players · avg rating ${avgOf(team,'rating')} · avg stamina ${avgOf(team,'stamina')}</span></h3>
        <div class="line-label">Attack</div>
        <div class="line">${lines.A.map(chip).join("") || '<span style="color:rgba(245,241,230,.5);font-size:12px;">—</span>'}</div>
        <div class="line-label">Mid</div>
        <div class="line">${lines.M.map(chip).join("") || '<span style="color:rgba(245,241,230,.5);font-size:12px;">—</span>'}</div>
        <div class="line-label">Defense</div>
        <div class="line">${lines.D.map(chip).join("") || '<span style="color:rgba(245,241,230,.5);font-size:12px;">—</span>'}</div>
      </div>
    `;
  }
  return `<div class="pitch-wrap">${pitchHtml(teamA,"Team A")}${pitchHtml(teamB,"Team B")}</div>`;
}

function toLocalInputValue(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function showMsg(targetId, text, isErr){
  const target = document.getElementById(targetId) || document.getElementById(targetId+"Msg");
  if(!target) return;
  target.innerHTML = `<div class="msg ${isErr?'msg-err':'msg-ok'}">${text}</div>`;
  setTimeout(()=>{ if(target) target.innerHTML=""; }, 4000);
}

/* ============ TYPING GUARD ============ */
// Prevents background live-sync from rebuilding a form while someone has a
// field focused.
let isEditingField = false;
document.addEventListener("focusin", (e)=>{
  if(e.target.matches("input, textarea, select")) isEditingField = true;
});
document.addEventListener("focusout", (e)=>{
  if(e.target.matches("input, textarea, select")){
    setTimeout(()=>{
      const active = document.activeElement;
      if(!active || !active.matches("input, textarea, select")) isEditingField = false;
    }, 50);
  }
});

/* ============ INIT + LIVE SYNC ============ */
function renderVoteCount(){
  const el = document.getElementById("voteTally");
  if(!el || !session) return;
  const n = session.players.length;
  el.textContent = n === 1 ? "1 player voted" : `${n} players voted`;
}
function refreshView(){
  if(!session) return;
  recompute(session);
  renderVoteCount();
  if(activeTab === "vote") return; // voting is personal, never disturb it with a live refresh
  if(isEditingField) return;       // don't rebuild out from under an in-progress edit
  renderActiveTab();
}
function init(){
  onValue(sessionRef, (snap)=>{
    session = normalizeSession(snap.exists() ? snap.val() : null);
    refreshView();
  }, (err)=> console.error("Session live sync error", err));

  onValue(poolRootRef, (snap)=>{
    pool = normalizePool(snap.exists() ? snap.val() : null);
    refreshView();
  }, (err)=> console.error("Pool live sync error", err));
}
init();
</script>
</body>
</html>
